{% set tpl = ix_lib.base.render.Render(values) %}
{% set cfg = values.github_actions_runner %}

{% set c1 = tpl.add_container(values.consts.github_actions_runner_container_name, "image") %}
{# The image configures the runner as root. Jobs talk to the host's Docker daemon through the socket. #}
{% do c1.set_user(values.consts.run_as_user, values.consts.run_as_group) %}
{% do c1.add_caps(["CHOWN", "DAC_OVERRIDE", "FOWNER", "KILL", "SETGID", "SETUID", "SETPCAP", "SETFCAP"]) %}
{# procps (pgrep) is not in the image, so look for the listener process through /proc #}
{% do c1.healthcheck.set_custom_test(["CMD", "bash", "-c", "grep -qs Runner.Listener /proc/[0-9]*/cmdline"]) %}

{% do c1.environment.add_env("RUN_AS_ROOT", "true") %}
{% do c1.environment.add_env("RUNNER_SCOPE", cfg.scope) %}
{% if cfg.scope == "repo" %}
  {% do c1.environment.add_env("REPO_URL", cfg.repo_url) %}
{% elif cfg.scope == "org" %}
  {% do c1.environment.add_env("ORG_NAME", cfg.org_name) %}
{% else %}
  {% do c1.environment.add_env("ENTERPRISE_NAME", cfg.enterprise_name) %}
{% endif %}
{% if cfg.scope != "repo" and cfg.runner_group %}
  {% do c1.environment.add_env("RUNNER_GROUP", cfg.runner_group) %}
{% endif %}

{% do c1.environment.add_env("ACCESS_TOKEN", cfg.access_token) %}
{% do c1.environment.add_env("GITHUB_HOST", cfg.github_host) %}
{% do c1.environment.add_env("RUNNER_NAME_PREFIX", cfg.runner_name_prefix) %}
{% do c1.environment.add_env("LABELS", cfg.labels) %}
{# The image treats any non-empty value as enabled, so only set these when they are on #}
{% if cfg.ephemeral %}
  {% do c1.environment.add_env("EPHEMERAL", "true") %}
{% endif %}
{% if cfg.disable_auto_update %}
  {% do c1.environment.add_env("DISABLE_AUTO_UPDATE", "true") %}
{% endif %}
{% do c1.environment.add_user_envs(cfg.additional_envs) %}

{% do c1.add_docker_socket() %}

{#
  Job containers and Docker container actions are started by the host's Docker daemon,
  which bind-mounts the work directory by its host path. The work directory must
  therefore have the same path inside this container as on the host.
#}
{% set work_host_path = tpl.funcs.get_host_path(values.storage.work) %}
{% do c1.add_storage(work_host_path, values.storage.work) %}
{% do c1.environment.add_env("RUNNER_WORKDIR", work_host_path) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
{% endfor %}

{% do tpl.notes.add_warning("Do not register this runner to public repositories: a pull request from a fork could run arbitrary code on this system with access to the Docker socket.") %}
{% do tpl.notes.add_warning("Jobs can reach the Docker socket, so any workflow can read this app's configuration, including the access token. Use a fine-grained token limited to the runner's repository or organization.") %}

{{ tpl.render() | tojson }}
