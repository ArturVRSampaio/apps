resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC

github_actions_runner:
  scope: org
  repo_url: ""
  org_name: octo-org
  enterprise_name: ""
  access_token: ghp_test_token
  runner_name_prefix: nas
  labels: truenas,docker
  runner_group: Default
  ephemeral: false
  disable_auto_update: false
  github_host: github.com
  additional_envs:
    - name: DEBUG_OUTPUT
      value: "true"

network:
  host_network: false
  networks: []

storage:
  work:
    type: host_path
    host_path_config:
      path: /opt/tests/mnt/runner-work
      create_host_path: true
  additional_storage: []
