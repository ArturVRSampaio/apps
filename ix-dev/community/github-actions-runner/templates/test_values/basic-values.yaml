resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC

github_actions_runner:
  scope: repo
  repo_url: https://github.com/octocat/hello-world
  org_name: ""
  enterprise_name: ""
  access_token: ghp_test_token
  runner_name_prefix: truenas
  labels: truenas
  runner_group: Default
  ephemeral: true
  disable_auto_update: true
  github_host: github.com
  additional_envs: []

network:
  host_network: false
  networks: []

ix_volumes:
  work: /opt/tests/mnt/work

storage:
  work:
    type: ix_volume
    ix_volume_config:
      dataset_name: work
      create_host_path: true
  additional_storage: []
